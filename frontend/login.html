<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial,sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#f3f4f6;
    }

    .login-container{
      background:white;
      padding:40px;
      width:350px;
      border-radius:15px;
      box-shadow:0 4px 15px rgba(0,0,0,0.1);
    }

    .login-container h2{
      text-align:center;
      margin-bottom:30px;
      color:#2563eb;
    }

    .input-group{
      margin-bottom:20px;
    }

    .input-group label{
      display:block;
      margin-bottom:8px;
      font-weight:bold;
    }

    .input-group input{
      width:100%;
      padding:12px;
      border:1px solid #ccc;
      border-radius:8px;
      font-size:16px;
    }

    .login-btn{
      width:100%;
      padding:12px;
      border:none;
      background:#2563eb;
      color:white;
      font-size:16px;
      border-radius:8px;
      cursor:pointer;
      transition:0.3s;
    }

    .login-btn:hover{
      background:#1d4ed8;
    }

    .bottom-text{
      text-align:center;
      margin-top:20px;
    }

    .bottom-text a{
      text-decoration:none;
      color:#2563eb;
      font-weight:bold;
    }

  </style>

</head>

<body>

  <div class="login-container">

    <h2>Login</h2>

    <form onsubmit="login(event)">

      <div class="input-group">

        <label>Email</label>

        <input
        type="email"
        id="email"
        placeholder="Enter email"
        required>

      </div>

      <div class="input-group">

        <label>Password</label>

        <input
        type="password"
        id="password"
        placeholder="Enter password"
        required>

      </div>

      <button type="submit" class="login-btn">
        Login
      </button>

    </form>

    <div class="bottom-text">

      Don't have an account?

      <a href="register.html">
        Register
      </a>

    </div>

  </div>

  <script>

    function login(event){

      event.preventDefault();

      const email =
      document.getElementById("email").value;

      const username =
      email.split("@")[0];

      localStorage.setItem(
        "username",
        username
      );

      alert("Login Successful");

      window.location.href =
      "home.html";

    }

  </script>

</body>
</html>
