<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Success</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial,sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#f3f4f6;
    }

    .success-container{
      background:white;
      padding:50px;
      border-radius:20px;
      text-align:center;
      box-shadow:0 4px 15px rgba(0,0,0,0.1);
      width:400px;
      animation:pop 0.5s ease;
    }

    @keyframes pop{

      0%{
        transform:scale(0.5);
        opacity:0;
      }

      100%{
        transform:scale(1);
        opacity:1;
      }

    }

    .checkmark{
      width:100px;
      height:100px;
      background:green;
      color:white;
      border-radius:50%;
      display:flex;
      justify-content:center;
      align-items:center;
      font-size:50px;
      margin:0 auto 25px;
    }

    h1{
      color:#111827;
      margin-bottom:15px;
    }

    p{
      color:gray;
      margin-bottom:30px;
      font-size:18px;
    }

    .btn{
      padding:14px 30px;
      border:none;
      background:#2563eb;
      color:white;
      font-size:16px;
      border-radius:8px;
      cursor:pointer;
      transition:0.3s;
    }

    .btn:hover{
      background:#1d4ed8;
    }

  </style>

</head>

<body>

  <div class="success-container">

    <div class="checkmark">
      ✓
    </div>

    <h1>Order Placed Successfully</h1>

    <p>
      Thank you for shopping with ShopEasy.
      Your order has been confirmed.
    </p>

    <button class="btn"
    onclick="continueShopping()">

      Continue Shopping

    </button>

  </div>

  <script>

    localStorage.removeItem("cart");

    function continueShopping(){

      window.location.href =
      "home.html";

    }

  </script>

</body>
</html>
